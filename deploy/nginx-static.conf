# Nginx для ТЕСТ-ДЕПЛОЯ статики alladintravelclub (без backend).
# Только отдаёт собранный фронтенд (dist/) + SPA-роутинг.
# Отдельный server-блок — конфиг docstoalladin.ru не трогается.
# Плейсхолдер __DOMAIN__ заменяется в deploy/setup-static.sh.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www/alladintravelclub/dist;
    index index.html;

    # Хэшированные ассеты Vite — кэшируем агрессивно.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA-роутинг: любой неизвестный путь отдаём index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
