# Nginx для сайта alladintravelclub (SPA на Vite + REST API на Node).
# Плейсхолдер __DOMAIN__ заменяется в deploy/setup-server.sh.
# ВАЖНО: это ОТДЕЛЬНЫЙ server-блок. Он НЕ трогает конфиг docstoalladin.ru —
# тот живёт в своём файле в /etc/nginx/sites-enabled/ и работает как раньше.
# После certbot сюда автоматически допишется блок HTTPS (listen 443 + SSL).

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Собранный фронтенд (vite build -> dist/). Статику отдаёт сам Nginx.
    root /var/www/alladintravelclub/dist;
    index index.html;

    # Лимит размера загружаемого файла (фото программ через админку).
    client_max_body_size 25m;

    # REST API (Express + PostgreSQL) на порту 3101.
    # Префикс /api срезается: /api/tours -> backend /tours.
    location /api/ {
        proxy_pass http://127.0.0.1:3101/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Фото программ, загруженные через админку (хранятся на сервере).
    location /uploads/ {
        alias /var/www/alladintravelclub/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Хэшированные ассеты Vite — кэшируем агрессивно.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA-роутинг: любой неизвестный путь отдаём index.html,
    # дальше react-router-dom разбирается сам.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
